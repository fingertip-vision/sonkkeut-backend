<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>손끝길 · 시연 키오스크</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eef4;font-family:Arial,'Malgun Gothic',sans-serif;color:#15253b}main{max-width:900px;min-height:100vh;margin:auto;background:white;padding:40px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #15253b;padding-bottom:24px}h1{font-size:38px;margin:0}h2{font-size:34px}button{cursor:pointer;border:2px solid #15253b;border-radius:12px;background:#fff;font:700 26px Arial,'Malgun Gothic';padding:22px;min-height:90px;color:#15253b}button.selected,button.primary{background:#15253b;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px 0}.menu{height:170px}.price{display:block;font-size:24px;margin-top:18px}footer{display:flex;gap:24px;margin-top:40px}footer button{flex:1}.cartline{display:flex;justify-content:space-between;font-size:26px;padding:22px 0;border-bottom:1px solid #bbb}.total{font-size:34px;text-align:right}.note{font-size:16px;color:#667}.payment{padding:50px 15px;text-align:center;font-size:34px}.payment strong{display:block;margin:30px;font-size:44px}.theme2 .grid{grid-template-columns:1fr}.theme3 header{border-color:#855912}.theme3 button.primary,.theme3 button.selected{background:#855912}.toolbar{font-size:16px}.toolbar a{color:#566}
</style><main id="app"></main><script>
const root=document.getElementById('app');const theme=new URLSearchParams(location.search).get('flow')||'1';
root.className='theme'+theme;
const menu=[{name:'아메리카노',price:4500},{name:'카페라떼',price:5000},{name:'바닐라라떼',price:5500},{name:'치즈케이크',price:6500}];
let state='menu',current,temperature='HOT',cart=[];
function btn(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b;}
function render(){root.replaceChildren();const header=document.createElement('header');header.innerHTML='<h1>카페 손끝</h1><span class="note">시연 키오스크 · 실제 결제 없음</span>';const count=document.createElement('p');count.style.fontSize='26px';count.textContent='장바구니 '+cart.length+'개';header.append(count);root.append(header);
const title=document.createElement('h2');const area=document.createElement('section');const footer=document.createElement('footer');root.append(title,area,footer);
if(state==='menu'){title.textContent='메뉴';const tabs=document.createElement('div');tabs.append(btn('커피',()=>{},'selected'),btn('디저트',()=>{}));area.append(tabs);const grid=document.createElement('div');grid.className='grid';menu.forEach(item=>{const b=btn(item.name,()=>{current=item;temperature='HOT';state='option';render()},'menu');const price=document.createElement('span');price.className='price';price.textContent=item.price.toLocaleString()+'원';b.append(price);grid.append(b)});area.append(grid);footer.append(btn('장바구니',()=>{state='cart';render()},'primary'));}
if(state==='option'){title.textContent=current.name;const label=document.createElement('h2');label.textContent='온도';area.append(label);const grid=document.createElement('div');grid.className='grid';['HOT','ICE'].forEach(temp=>grid.append(btn(temp+(temperature===temp?' 선택됨':''),()=>{temperature=temp;render()},temperature===temp?'selected':'')));area.append(grid);const p=document.createElement('p');p.className='total';p.textContent=current.price.toLocaleString()+'원';area.append(p);footer.append(btn('뒤로',()=>{state='menu';render()}),btn('담기',()=>{cart.push({...current,temp:temperature});state='menu';render()},'primary'));}
if(state==='cart'){title.textContent='장바구니';cart.forEach(item=>{const row=document.createElement('div');row.className='cartline';row.textContent=item.name+' '+item.temp+' 1개';const p=document.createElement('span');p.textContent=item.price.toLocaleString()+'원';row.append(p);area.append(row)});const p=document.createElement('p');p.className='total';p.textContent='총 금액 '+cart.reduce((sum,item)=>sum+item.price,0).toLocaleString()+'원';area.append(p);footer.append(btn('계속 주문',()=>{state='menu';render()}),btn('결제하기',()=>{if(cart.length){state='payment';render()}},'primary'));}
if(state==='payment'){title.textContent='카드 결제 화면';area.className='payment';area.textContent='카드를 넣어 주세요';const total=document.createElement('strong');total.textContent=cart.reduce((sum,item)=>sum+item.price,0).toLocaleString()+'원';area.append(total);footer.append(btn('새 주문',()=>{cart=[];state='menu';render()}));}
const tools=document.createElement('p');tools.className='toolbar';tools.innerHTML='<a href="?flow=1">시연 1</a> · <a href="?flow=2">시연 2</a> · <a href="?flow=3">시연 3</a>';root.append(tools);
// Normalized structure is available to browser integration tests; the mobile app reads camera pixels.
root.dataset.screenType=state;
}render();
</script></html>
