<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손끝길 사용 통계</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap row">
    <strong class="brand">손끝길 · 통계</strong>
    <nav><a href="/owner">메뉴 등록</a><a href="/dashboard" aria-current="page">사용 통계</a><a href="/docs">API</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="card">
    <h1>사용 통계</h1>
    <p class="muted">손끝길 앱이 보낸 익명 기록입니다. 영상·음성·위치·기기 정보는 받지 않고, 단계별 성공 여부와 걸린 시간만 모읍니다.</p>
    <form id="f" class="row wrapit">
      <label>매장 코드 <input name="code" maxlength="12" placeholder="비우면 전체(운영자)"></label>
      <label>점주 키 / 운영자 키 <input name="key" type="password" autocomplete="off"></label>
      <label>기간 <select name="days"><option value="7">7일</option><option value="30" selected>30일</option><option value="90">90일</option></select></label>
      <button>보기</button>
    </form>
    <p id="msg" class="err" role="alert"></p>
  </section>

  <section id="out" hidden>
    <div class="kpis">
      <div class="kpi"><span>주문 시도</span><b id="k-sessions">–</b></div>
      <div class="kpi"><span>결제 화면까지 간 비율</span><b id="k-completed">–</b></div>
      <div class="kpi"><span>버튼 누르기 성공률</span><b id="k-step">–</b></div>
      <div class="kpi"><span>버튼 하나 찾는 데 평균</span><b id="k-reach">–</b></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>화면 종류별</h2>
        <p class="muted small">어느 화면에서 손님이 가장 어려워하는지 봅니다.</p>
        <div id="screens"></div>
      </div>
      <div class="card">
        <h2>실패 원인</h2>
        <div id="fails"></div>
      </div>
    </div>
    <div class="card">
      <h2>날짜별</h2>
      <div class="table"><table><thead><tr><th>날짜</th><th>주문 시도</th><th>완료</th></tr></thead><tbody id="daily"></tbody></table></div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s)
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const pct = (v) => (v == null ? '–' : `${Math.round(v * 100)}%`)
const SCREEN = { menu: '메뉴', option: '옵션', cart: '장바구니', payment: '결제', start: '첫 화면', unknown: '알 수 없음' }
const FAIL = { no_change: '눌리지 않음', 'unexpected:screen_type': '다른 화면으로 감', abandoned: '중간에 그만둠',
               uncertain: '확인 불가', restarted: '키오스크 초기화', fail: '실패' }

function bars(el, entries, fmt) {
  const max = Math.max(1, ...entries.map((e) => e.value))
  el.innerHTML = entries.length ? entries.map((e) => `
    <div class="bar"><span class="lbl">${esc(e.label)}</span>
      <span class="track"><span class="fill" style="width:${(e.value / max) * 100}%"></span></span>
      <span class="val">${esc(fmt(e))}</span></div>`).join('') : '<p class="muted">아직 기록이 없습니다</p>'
}

try { const c = localStorage.getItem('sk.code'), k = localStorage.getItem('sk.key'); if (c) { $('#f').code.value = c; $('#f').key.value = k || '' } } catch {}

$('#f').onsubmit = async (e) => {
  e.preventDefault()
  const f = e.target, code = f.code.value.trim().toUpperCase(), key = f.key.value.trim()
  const qs = new URLSearchParams({ days: f.days.value })
  if (code) qs.set('store_code', code)
  const headers = code ? { 'X-Owner-Key': key, 'X-Admin-Key': key } : { 'X-Admin-Key': key }
  $('#msg').textContent = ''
  try {
    const r = await fetch(`/api/stats/summary?${qs}`, { headers })
    const d = await r.json()
    if (!r.ok) throw new Error(d.detail || r.statusText)
    $('#out').hidden = false
    $('#k-sessions').textContent = d.sessions
    $('#k-completed').textContent = pct(d.completed_rate)
    $('#k-step').textContent = pct(d.step_success_rate)
    $('#k-reach').textContent = d.avg_reach_s == null ? '–' : `${d.avg_reach_s}초`
    bars($('#screens'), Object.entries(d.by_screen).map(([k, v]) => ({ label: SCREEN[k] || k, value: v.success_rate, v })),
         (e) => `${pct(e.value)} · ${e.v.steps}번 · ${e.v.avg_reach_s ?? '–'}초`)
    bars($('#fails'), Object.entries(d.fail_reasons).map(([k, v]) => ({ label: FAIL[k] || k, value: v })), (e) => `${e.value}번`)
    $('#daily').innerHTML = d.daily.map((x) => `<tr><td>${esc(x.date)}</td><td>${x.sessions}</td><td>${x.completed}</td></tr>`).join('')
      || '<tr><td colspan="3" class="muted">기록 없음</td></tr>'
  } catch (err) { $('#msg').textContent = err.message }
}
</script>
</body>
</html>
