spring.application.name=sonkkeut-backend

# 로컬에서는 프로젝트 루트의 .env를 읽고, 서버에서는 환경 변수를 쓴다.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sonkkeut}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마가 팀에서 확정되기 전까지는 엔티티 기준으로 자동 반영한다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# 팀원이 서버가 살아 있는지 확인할 수 있게 health만 공개한다.
management.endpoints.web.exposure.include=health

# 브라우저에서 호출할 수 있는 출처. 쉼표로 여러 개를 넣는다. 프론트 주소가 정해지기 전까지는 모두 허용한다.
cors.origins=${CORS_ORIGINS:*}

# 요청·응답 JSON은 앱과 점주 화면이 쓰는 snake_case로 맞춘다(PR #1 계약).
spring.jackson.property-naming-strategy=SNAKE_CASE
# 통계에 정의되지 않은 필드(영상·음성·위치 등)가 실려 오면 거부한다. 매장·메뉴 요청은 클래스별로 무시하도록 풀어 둔다.
spring.jackson.deserialization.fail-on-unknown-properties=true

# 운영자 키. 비어 있으면 전체 매장 목록·전체 통계 같은 운영자 API를 아무도 쓸 수 없다.
sonkkeut.admin-key=${ADMIN_KEY:}

# 인증 없이 받는 통계의 IP당 1분 전송 한도
stats.rate-per-min=${STATS_RATE_PER_MIN:30}

# 앱이 받을 최신 모델 버전과 모델 파일 주소. 주소가 비어 있으면 앱은 APK에 든 모델을 쓴다.
model.version=${MODEL_VERSION:}
model.base-url=${MODEL_BASE_URL:}

# API 문서. 점주 화면의 "API" 메뉴가 /docs로 연결된다.
springdoc.swagger-ui.path=/docs
