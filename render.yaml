# Render Blueprint: 웹 서비스(무료) + Postgres(무료)를 한 번에 만든다
# Render 대시보드 → New → Blueprint → 이 레포 선택
services:
  - type: web
    name: sonkkeut-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sonkkeut-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
databases:
  - name: sonkkeut-db
    plan: free
    region: singapore
    databaseName: sonkkeut
    user: sonkkeut
