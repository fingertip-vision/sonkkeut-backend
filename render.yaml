# Render Blueprint: 웹 서비스(무료) + Postgres(무료)를 한 번에 만든다
# Render 대시보드 → New → Blueprint → 이 레포 선택
services:
  - type: web
    name: sonkkeut-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sonkkeut-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: STATS_RATE_PER_MIN
        value: "120"
databases:
  - name: sonkkeut-db
    plan: free
    region: singapore
    databaseName: sonkkeut
    user: sonkkeut
    ipAllowList: []
